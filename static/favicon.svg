<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Grönland & Nordsibirien -->
  <rect x="6" y="3" width="2" height="1" fill="#4CAF50"/>
  <rect x="10" y="3" width="4" height="1" fill="#4CAF50"/>

  <!-- Kanada, Großbritannien, Russland -->
  <rect x="2" y="4" width="4" height="1" fill="#4CAF50"/>
  <rect x="8" y="4" width="1" height="1" fill="#4CAF50"/>
  <rect x="10" y="4" width="5" height="1" fill="#4CAF50"/>

  <!-- USA, Südeuropa, Zentralasien, Japan -->
  <rect x="2" y="5" width="4" height="1" fill="#4CAF50"/>
  <rect x="8" y="5" width="6" height="1" fill="#4CAF50"/>
  <rect x="15" y="5" width="1" height="1" fill="#4CAF50"/>

  <!-- Mexiko, Nordafrika, Naher Osten -->
  <rect x="2" y="6" width="3" height="1" fill="#4CAF50"/>
  <rect x="7" y="6" width="7" height="1" fill="#4CAF50"/>

  <!-- Mittelamerika, Zentralafrika, Südostasien -->
  <rect x="3" y="7" width="2" height="1" fill="#4CAF50"/>
  <rect x="7" y="7" width="5" height="1" fill="#4CAF50"/>
  <rect x="13" y="7" width="2" height="1" fill="#4CAF50"/>

  <!-- Südamerika (Nord), Südafrika, Indonesien -->
  <rect x="4" y="8" width="2" height="1" fill="#4CAF50"/>
  <rect x="7" y="8" width="4" height="1" fill="#4CAF50"/>
  <rect x="12" y="8" width="3" height="1" fill="#4CAF50"/>

  <!-- Südamerika (Mitte), Madagaskar, Australien -->
  <rect x="4" y="9" width="2" height="1" fill="#4CAF50"/>
  <rect x="8" y="9" width="2" height="1" fill="#4CAF50"/>
  <rect x="11" y="9" width="1" height="1" fill="#4CAF50"/>
  <rect x="13" y="9" width="3" height="1" fill="#4CAF50"/>

  <!-- Südamerika (Süd), Kap der Guten Hoffnung, Australien (Süd) -->
  <rect x="5" y="10" width="1" height="1" fill="#4CAF50"/>
  <rect x="8" y="10" width="1" height="1" fill="#4CAF50"/>
  <rect x="13" y="10" width="2" height="1" fill="#4CAF50"/>

  <!-- Neuseeland -->
  <rect x="14" y="11" width="1" height="1" fill="#4CAF50"/>
</svg>
