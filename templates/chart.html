<!DOCTYPE html>
<html>
<head>
<title>Karte & Suche</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
crossorigin=""/>
<link rel="stylesheet" href="{{ url_for('static', path='css/map.css') }}?v=2">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>

<div id="map"></div>

<script>
    window.STANDORTE_DATA = {{ standorte_json | safe }};
</script>

<h1>Suche</h1>
<form action="/chart" method="get">
<input type="text" name="ort_begriff" placeholder="Suche nach Ort..." value="{{ ort_begriff if ort_begriff else '' }}">
<input type="text" name="person_begriff" placeholder="Suche nach Person..." value="{{ person_begriff if person_begriff else '' }}">

<label>
<input type="radio" name="typ" value="alle" {% if typ == "alle" or not typ %}checked{% endif %}> Alle
</label>
<label>
<input type="radio" name="typ" value="ambulant" {% if typ == "ambulant" %}checked{% endif %}> Ambulant
</label>
<label>
<input type="radio" name="typ" value="stationär" {% if typ == "stationär" %}checked{% endif %}> Stationär
</label>
<button type="submit">Suchen</button>
</form>
    {% if rows %}
<table border="1">
<tr>
            {% for key in rows[0].keys() %}
<th>{{ key }}</th>
            {% endfor %}
</tr>
        {% for row in rows %}
<tr>
            {% for value in row.values() %}
<td>{{ value }}</td>
            {% endfor %}
</tr>
        {% endfor %}
</table>
    {% else %}
<p>Keine Ergebnisse gefunden.</p>
    {% endif %}


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="{{ url_for('static', path='js/map.js') }}?v=2"></script>
</body>
</html>
