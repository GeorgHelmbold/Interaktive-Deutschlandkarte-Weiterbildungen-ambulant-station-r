<!DOCTYPE html>
<html>
<head>
<title>Alle Bundesländer</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<h1>Alle Bundesländer</h1>
<form action="/suche-alle" method="get">
<input type="text" name="ort_begriff" placeholder="Suche nach Ort..." value="{{ ort_begriff if ort_begriff else '' }}">
<input type="text" name="person_begriff" placeholder="Suche nach Person..." value="{{ person_begriff if person_begriff else '' }}">

<label>
<input type="radio" name="typ" value="alle" {% if typ == "alle" or not typ %}checked{% endif %}> Alle
</label>
<label>
<input type="radio" name="typ" value="ambulant" {% if typ == "ambulant" %}checked{% endif %}> Ambulant
</label>
<label>
<input type="radio" name="typ" value="stationär" {% if typ == "stationär" %}checked{% endif %}> Stationär
</label>
<button type="submit">Suchen</button>
</form>
    {% if rows %}
<table border="1">
<tr>
            {% for key in rows[0].keys() %}
<th>{{ key }}</th>
            {% endfor %}
</tr>
        {% for row in rows %}
<tr>
            {% for value in row.values() %}
<td>{{ value }}</td>
            {% endfor %}
</tr>
        {% endfor %}
</table>
    {% else %}
<p>Keine Ergebnisse gefunden.</p>
    {% endif %}
</body>
</html>
