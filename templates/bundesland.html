<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ bundesland }}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e0e2e7;
    --text: #1f2328;
    --text-muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 1.5rem 0;
  }

  form {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
  }

  form input[type="text"] {
    flex: 1 1 200px;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.95rem;
    background: var(--bg);
    color: var(--text);
  }

  form input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }

  .radio-group {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }

  form label {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.9rem;
    color: var(--text-muted);
    cursor: pointer;
  }

  form label.visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  form input[type="radio"] {
    accent-color: var(--accent);
  }

  form button {
    padding: 0.5rem 1.25rem;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  form button:hover {
    background: var(--accent-hover);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    font-size: 0.9rem;
  }

  th, td {
    text-align: left;
    padding: 0.6rem 0.9rem;
    border-bottom: 1px solid var(--border);
  }

  th {
    background: var(--bg);
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.03em;
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:hover td {
    background: var(--bg);
  }

  p {
    color: var(--text-muted);
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<h1>{{ bundesland }}</h1>

<form action="/suche" method="get">
  <input type="hidden" name="bundesland" value="{{ bundesland }}">

  <label class="visually-hidden" for="ort_begriff">Suche nach Ort</label>
  <input id="ort_begriff" type="text" name="ort_begriff" placeholder="Suche nach Ort..." value="{{ ort_begriff if ort_begriff else '' }}">
  <label class="visually-hidden" for="person_begriff">Suche nach Person</label>
  <input id="person_begriff" type="text" name="person_begriff" placeholder="Suche nach Person..." value="{{ person_begriff if person_begriff else '' }}">

  <div class="radio-group">
    <label>
      <input type="radio" name="typ" value="alle" {% if typ == "alle" or not typ %}checked{% endif %}> Alle
    </label>
    <label>
      <input type="radio" name="typ" value="ambulant" {% if typ == "ambulant" %}checked{% endif %}> Ambulant
    </label>
    <label>
      <input type="radio" name="typ" value="stationär" {% if typ == "stationär" %}checked{% endif %}> Stationär
    </label>
  </div>

  <button type="submit">Suchen</button>
</form>

{% if rows %}
<table>
  <thead>
  <tr>
    {% for key in rows[0].keys() %}
    <th scope="col">{{ key }}</th>
    {% endfor %}
  </tr>
  </thead>
  <tbody>
  {% for row in rows %}
  <tr>
    {% for value in row.values() %}
    <td>{{ value }}</td>
    {% endfor %}
  </tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<p>Keine Ergebnisse gefunden.</p>
{% endif %}
</body>
</html>
